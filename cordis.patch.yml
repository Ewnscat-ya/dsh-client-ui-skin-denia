# denia skin bundle patch: inserts its public dsh.client entry into the web plugin roster.
# The bundle is the official dsh plugin shape — install it with
# `dsh plugin --profile <name> add <path>`; mutual exclusion between skins is
# managed by scripts/dsh-skin (home-layer disabled rows).
#
# `config.lockPet` is an extra, file-level lock for the pet's position: setting it
# to true freezes dragging even when the in-app "锁定位置" switch is off. The
# in-app switch stays authoritative for everything else.
- insert:
    - id: ui-skin-denia-rewrite
      name: '@dsh-external/dsh-client-ui-skin-denia-rewrite'
      config:
        lockPet: false
